# Over-the-air update for tester APKs (channel "preview"): every push to the app's branches that touches the app or
# the shared package publishes the new JS bundle; phones pick it up on their next launch (same app version only).
name: Publish tester update

on:
  push:
    branches: ['main', 'ccr-41770098-9l0q6b']
    paths: ['apps/mobile/**', 'packages/shared/**', '!**/*.md']

jobs:
  # Phones ask for the "preview" channel (local APKs send it as a request header); EAS only creates channels for its own
  # builds, so make sure it exists and points at the "preview" branch. No-op once it exists.
  ensure_channel:
    name: Ensure preview channel
    steps:
      - uses: eas/checkout
      - run: npx -y eas-cli@latest channel:view preview --non-interactive > /dev/null 2>&1 || npx -y eas-cli@latest channel:create preview --non-interactive

  publish_preview_update:
    name: Publish preview update (Android)
    needs: [ensure_channel]
    type: update
    environment: preview
    env:
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_DEV_TOOLS: '1'
    params:
      branch: preview
      platform: android
      message: ${{ github.commit_message || 'Tester update' }}
