# Backend API for Catapult Math Athletes (deployed by ../scripts/deploy-netlify.mjs; see ../README.md).
[build]
  publish = "public"

[functions]
  directory = "functions"
  # The handlers come from lib/ (CommonJS) and the bundler doesn't trace their requires, so ship the dependencies
  # (only firebase-admin, firebase-functions and their own dependencies are installed here) as they are.
  # Paths are relative to the site root, which the CLI takes to be the repo root (npm workspaces). Only this folder's
  # node_modules: the repo root's (the app's tooling, hundreds of MB) must never be shipped. "**" alone would match only
  # the directory, "**/*" matches the files.
  included_files = ["backend/netlify/node_modules/**/*"]
